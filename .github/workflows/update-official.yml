# ดึงฝนและระดับน้ำจากสถานีทางการ (ThaiWater) ทุก 15 นาที แล้วเผยแพร่ data/official.json ไปที่บรานช์ "data"
# ไม่ต้องตั้ง secret ใดๆ (ใช้ endpoint สาธารณะ) รีโปต้องเป็นสาธารณะเพื่อให้เว็บอ่านไฟล์ได้
# หมายเหตุ: บรานช์ data ถูกเขียนทับทุกรอบ และ GitHub อาจหน่วงรอบเวลาได้หลายนาทีในช่วงที่ระบบคนใช้เยอะ
name: update-official-data
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-official-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ดึงข้อมูลสถานีวัด
        run: python tools/fetch_thaiwater.py
      - name: เผยแพร่ไปที่บรานช์ data
        run: |
          mkdir /tmp/pub && cp data/official.json /tmp/pub/official.json
          cd /tmp/pub
          git init -q -b data
          git config user.name "flood-bot"
          git config user.email "flood-bot@users.noreply.github.com"
          git add official.json
          git commit -q -m "อัปเดตสถานีวัด $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
